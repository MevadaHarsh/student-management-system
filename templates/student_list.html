<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  
  <div class="container-fluid py-4">
    <div class="card shadow-sm">
      <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-semibold">Student List</h5>
        <a class="btn btn-primary btn-sm px-3" href="{% url 'form' %}">
          + Add New Student
        </a>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0" id="studentTable">
            <thead class="table-light">
              <tr >
                <th class="col-3">Name</th>
                <th class="col-3">Enrollment No.</th>
                <th class="col-3">Date of Birth</th>
                <th class="col-3">Action</th>
              </tr>
            </thead>
            <tbody>
              {% for i in st %}
                <tr>
                  <td>{{i.name}}</td>
                  <td>{{i.enno}}</td>
                  <td>{{i.dob}}</td>
                  <td><a href="{% url 'st_up' i.id %}" class="btn btn-success">EDIT</a>  <a href="{% url 'st_del' i.id %}" class="btn btn-danger">DELETE</a></td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
      <div class="card-footer bg-white text-muted small px-4 py-2" id="footerCount"></div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
