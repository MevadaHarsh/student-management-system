<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  
  <div class="container" id="studentModal">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form action="" method="post">
          {% csrf_token %}
          <div class="modal-header">
            <h6 class="modal-title fw-semibold mb-4 h2 fw-bold" id="modalTitle">Add New Student</h6>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label fw-medium" for="name">Full Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="name" name="name">
            </div>
            <div class="mb-3">
              <label class="form-label fw-medium" for="enno">Enrollment No. <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="enno" placeholder="e.g. EN2024001" name="enno">
            </div>
            <div class="mb-3">
              <label class="form-label fw-medium" for="dob">Date of Birth <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="dob" name="dob">
            </div>
          </div>
          <div class="mt-3">
            <button class="btn btn-primary btn-sm px-4 py-2">Save Student</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
